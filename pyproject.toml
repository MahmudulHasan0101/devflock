[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflock"
version = "0.3.0"
description = "Orchestrate many Claude Code workers across separate model endpoints"
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.157", "aiohttp>=3.9", "click>=8.1", "rich>=13"]

[project.scripts]
devflock = "devflock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
